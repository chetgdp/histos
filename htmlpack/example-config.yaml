pack:
  # core.js loads the WASM module; decoder unpacks brotli-compressed binaries
  runtime:
    enabled: true
    icon: true
    core: true
    decoder: true

  metadata:
    title: "My App"
    author: "Your Name"
    description: "Packed by histos"
    keywords: "wasm, rust, offline"

  favicon:
    - ./assets/icon.svg

  css:
    - https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css
    - ./styles/app.css

  scripts:
    - ./src/init.js

  wasm:
    app:
      # parent of pkg/; run `wasm-pack build --target no-modules` there first
      path: ./my-wasm-project
      # must be "bin-wasm-app" for the default runtime
      id: "bin-wasm-app"
      compile_wasm: false
      compression: "brotli"
