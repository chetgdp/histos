<svg width="256" height="256" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="histos">
  <!-- color: portfolio green; swap for currentColor to inherit text color -->
  <g stroke="#2f7e39" stroke-linecap="round" stroke-linejoin="round">
    <!-- loom frame uprights -->
    <line x1="7" y1="5" x2="7" y2="27" stroke-width="2.4"/>
    <line x1="25" y1="5" x2="25" y2="27" stroke-width="2.4"/>
    <!-- top cloth beam (overhangs the posts) -->
    <line x1="4.5" y1="7" x2="27.5" y2="7" stroke-width="2.4"/>
    <!-- warp threads hanging from the beam -->
    <line x1="10.5" y1="8.4" x2="10.5" y2="22" stroke-width="1.3"/>
    <line x1="14" y1="8.4" x2="14" y2="22" stroke-width="1.3"/>
    <line x1="18" y1="8.4" x2="18" y2="22" stroke-width="1.3"/>
    <line x1="21.5" y1="8.4" x2="21.5" y2="22" stroke-width="1.3"/>
    <!-- weft passes: the woven cloth forming at the top -->
    <line x1="9.5" y1="11" x2="22.5" y2="11" stroke-width="1.3"/>
    <line x1="9.5" y1="13.4" x2="22.5" y2="13.4" stroke-width="1.3"/>
  </g>
  <!-- warp weights -->
  <g fill="#2f7e39">
    <circle cx="10.5" cy="23.8" r="1.5"/>
    <circle cx="14" cy="23.8" r="1.5"/>
    <circle cx="18" cy="23.8" r="1.5"/>
    <circle cx="21.5" cy="23.8" r="1.5"/>
  </g>
</svg>
